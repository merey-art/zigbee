# Mosquitto MQTT Broker — local network, no auth required
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# MQTT over TCP
listener 1883
allow_anonymous true
protocol mqtt

# WebSocket listener (optional — useful for browser-native MQTT clients)
listener 9001
allow_anonymous true
protocol websockets
