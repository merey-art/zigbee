version: "3.9"

networks:
  zigbee-net:
    driver: bridge

volumes:
  postgres-data:
  zigbee2mqtt-data:
  mosquitto-data:
  mosquitto-log:

services:

  # ── MQTT Broker ────────────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    restart: unless-stopped
    # Host 1883/9001 often busy locally; use 11883 (MQTT), 19101 (MQTT WS)
    ports:
      - "11883:1883"
      - "19101:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - zigbee-net

  # ── Zigbee2MQTT ────────────────────────────────────────────────────────────
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    container_name: zigbee2mqtt
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      - TZ=${TZ:-Europe/Warsaw}
    volumes:
      - ./zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - ${ZIGBEE_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0
    # No host port publish: the Zigbee2MQTT web UI listens on 8080 only inside zigbee-net
    # (e.g. zigbee2mqtt:8080 for other containers). It must not be reachable from outside
    # Docker; for occasional admin access, use SSH local forwarding from your machine, e.g.
    #   ssh -L 8081:localhost:8080 user@server
    networks:
      - zigbee-net

  # ── TimescaleDB (PostgreSQL + time-series extension) ───────────────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zigbee}
      POSTGRES_USER: ${POSTGRES_USER:-zigbee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zigbeepass}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "15432:5432"
    networks:
      - zigbee-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zigbee} -d ${POSTGRES_DB:-zigbee}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ───────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-zigbee}:${POSTGRES_PASSWORD:-zigbeepass}@timescaledb:5432/${POSTGRES_DB:-zigbee}
      MQTT_HOST: mosquitto
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_BASE_TOPIC: zigbee2mqtt
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-development-only}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EMERGENCY_TEMP_RATE: ${EMERGENCY_TEMP_RATE:-2.0}
      EMERGENCY_CO2_RATE: ${EMERGENCY_CO2_RATE:-200}
      EMERGENCY_TEMP_ABSOLUTE: ${EMERGENCY_TEMP_ABSOLUTE:-35}
      EMERGENCY_SUSTAINED_READINGS: ${EMERGENCY_SUSTAINED_READINGS:-2}
      EMERGENCY_DEVICE_PAIRS: ${EMERGENCY_DEVICE_PAIRS:-}
    networks:
      - zigbee-net

  # ── Web UI (nginx reverse proxy + React SPA) ──────────────────────────────
  # Single published HTTP port: SPA at `/`, API at `/api/`, WebSocket at `/ws`.
  frontend:
    build:
      context: ./frontend
      args:
        # Leave empty so the bundle uses same-origin `/api` and `/ws` behind this nginx.
        VITE_API_URL: ""
        VITE_WS_URL: ""
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - zigbee-net
